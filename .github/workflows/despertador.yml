name: Usina Automática Diária

on:
  schedule:
    - cron: '17 4,5,6 * * *' # 01:17, 02:17, 03:17 BRT (fora da hora cheia: GitHub descarta/atrasa :00)
  push:
    paths:
      - '.github/workflows/despertador.yml'  # roda na hora sempre que este arquivo muda
  workflow_dispatch: 

jobs:
  produzir_videos:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3'
      - run: pip install --upgrade google-genai gspread
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GOOGLE_CREDENTIALS_PT: ${{ secrets.GOOGLE_CREDENTIALS_PT }}
        run: for i in 1 2 3 4 5 6; do python usina.py || echo "execucao $i falhou"; done
